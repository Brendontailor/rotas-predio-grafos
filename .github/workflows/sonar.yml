name: sonar

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi

      - name: SonarQube scan
        uses: sonarsource/sonarcloud-github-action@e44258b109568baa0df60ed515909fc6c72cba92 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Brendontailor_rotas-predio-grafos
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/vendor/**,**/.git/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/coverage/**,**/*.min.js,**/*.min.css
            -Dsonar.cpd.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/vendor/**,**/.git/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/coverage/**,**/*.min.js,**/*.min.css
            -Dsonarqube.qualitygate.wait=true
            -Dsonar.python.coverage.reportPaths=coverage.xml
